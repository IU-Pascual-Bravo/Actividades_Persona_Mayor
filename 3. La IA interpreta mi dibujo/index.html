<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA interpreta mi boceto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --canvas-width: 600px;
        --canvas-height: 400px;
    }
    
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f0f2f5;
        color: #333;
        display: flex;
        flex-direction: column; 
        align-items: center;
        margin: 0;
        padding: 40px 20px;
        box-sizing: border-box;
    }

    #main-container {
        background-color: #ffffff;
        padding: 2rem 3rem;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 700px;
        text-align: center;
    }

    header {
        margin-bottom: 1.5rem;
    }

    .header-branding {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        width: 100%;
    }

    .header-logo {
        width: 155px;
        height: 78px;
        object-fit: contain;
        flex: 0 0 155px;
    }

    header h1 {
        font-family: 'Bangers', cursive;
        font-size: 2.55rem;
        color: #007bff;
        margin: 0;
        letter-spacing: 2px;
        line-height: 1.05;
        flex: 1;
    }

    header p {
        font-size: 1.1rem;
        color: #666;
        margin: 1rem 0 0;
    }

    @media (max-width: 650px) {
        .header-branding { gap: 8px; }
        .header-logo { width: 92px; height: 58px; flex-basis: 92px; }
        header h1 { font-size: 1.85rem; letter-spacing: 1px; }
        header p { font-size: 0.95rem; }
    }

    .section-title {
        font-family: 'Bangers', cursive;
        font-size: 1.8rem;
        color: #6c757d;
        margin: 1.5rem 0 1rem 0;
    }

    #controls {
        margin-bottom: 1rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    #controls label {
        font-weight: bold;
    }

    input[type="color"] {
        -webkit-appearance: none; -moz-appearance: none; appearance: none;
        width: 40px; height: 40px; background-color: transparent;
        border: none; cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: 2px solid #ddd; }
    input[type="color"]::-moz-color-swatch { border-radius: 50%; border: 2px solid #ddd; }

    #color-palette { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: 300px; }

    .color-swatch {
        width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
        border: 2px solid transparent; transition: all 0.2s ease; flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active { border-color: #333; transform: scale(1.15); }
    .color-swatch[style*="#ffffff"] { border: 2px solid #ddd; }
    .color-swatch[style*="#ffffff"].active { border-color: #333; }
    #undoBtn, #eraserBtn { background-color: #f8f9fa; border: 2px solid #6c757d; color: #6c757d; font-size: 0.9rem; padding: 8px 16px; }
    #undoBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #eraserBtn.active { background-color: #6c757d; color: white; border-color: #6c757d; }
    
    /* --- Comparison Slider Styles --- */
    #comparison-container {
        position: relative;
        width: var(--canvas-width);
        height: var(--canvas-height);
        max-width: 100%;
        margin: 0 auto;
        border-radius: 10px;
        overflow: hidden;
        border: 3px dashed #ccc;
    }

    #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    
    #drawingCanvas {
        cursor: crosshair;
        touch-action: none;
        display: block; /* Removes bottom space */
    }

    #ai-image-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 50%; /* Initial position of the slider */
        height: 100%;
        overflow: hidden;
    }

    #ai-image-element {
        width: var(--canvas-width);
        height: var(--canvas-height);
        max-width: none; /* Important for the sliding effect */
        display: block;
    }

    #slider-handle {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 4px;
        background-color: rgba(255, 255, 255, 0.8);
        cursor: ew-resize;
        transform: translateX(-50%);
        z-index: 10;
    }

    #slider-handle::before {
        content: '◀▶';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 123, 255, 0.9);
        color: white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 16px;
        border: 2px solid white;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    
    #canvas-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(255, 255, 255, 0.85);
        display: none; justify-content: center; align-items: center;
        font-family: 'Bangers', cursive; font-size: 2.5rem; color: #333;
        z-index: 20; pointer-events: none; text-align: center; padding: 20px;
    }

    #fillBtn { background-color: #f8f9fa; border: 2px solid #6c757d; color: #6c757d; font-size: 0.9rem; padding: 8px 16px; }
    #fillBtn.active { background-color: #6c757d; color: white; border-color: #6c757d; }

    #action-buttons { margin-top: 1.5rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

    button {
        font-family: 'Inter', sans-serif; font-weight: bold; font-size: 1rem;
        padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
    }

    #submitBtn { background-color: #e53935; color: white; }
    #submitBtn:hover { background-color: #c62828; transform: translateY(-2px); }
    #submitBtn:disabled { background-color: #9e9e9e; cursor: not-allowed; }
    
    #generateBtn {
        padding: 10px 20px; font-size: 0.9rem; background-color: #28a745; color: white; flex-shrink: 0;
    }
    #generateBtn:hover { background-color: #218838; }
    #generateBtn:disabled { background-color: #9e9e9e; cursor: not-allowed; }

    #uploadBtn { background-color: #17a2b8; color: white; }
    #uploadBtn:hover { background-color: #138496; }

    #clearBtn { background-color: #6c757d; color: white; }
    #clearBtn:hover { background-color: #5a6268; }

    #downloadSketchBtn, #downloadAiBtn { background-color: #6f42c1; color: white; }
    #downloadSketchBtn:hover, #downloadAiBtn:hover { background-color: #59339d; }
    #downloadAiBtn:disabled { background-color: #9e9e9e; cursor: not-allowed; }

    #ai-generator {
        margin-top: 2rem; padding: 1.5rem; background-color: #e9ecef; border-radius: 10px;
    }
    #prompt-container { display: flex; gap: 10px; align-items: center; }
    #promptInput {
        flex-grow: 1; padding: 10px; border: 2px solid #ced4da; border-radius: 6px; font-size: 0.9rem;
    }
    
    #modelSelector, #styleSelector {
        padding: 10px;
        border: 2px solid #ced4da;
        border-radius: 6px;
        font-size: 0.9rem;
        background-color: white;
        cursor: pointer;
        flex-shrink: 0;
    }

    #page-footer {
        margin-top: 2rem; text-align: center; font-size: 0.85rem; color: #888;
        width: 100%; max-width: 700px;
    }
    </style>
</head>
<body>
    <div id="main-container">
        <header>
            <div class="header-branding">
                <img class="header-logo" src="logoPB10.png" onerror="this.onerror=null; this.src='logoPB1.png';" alt="Logo Institución Universitaria Pascual Bravo">
                <h1>IA interpreta mi boceto</h1>

        <!-- IMPLEMENTACIÓN BYOP -->
        <p class="section-title">1. Dibuja o sube tu idea</p>

        <div id="controls">
            <label>Herramienta:</label>
            <button id="fillBtn">Rellenar</button>
            <button id="eraserBtn">Borrador</button>
            <button id="undoBtn" disabled>Deshacer</button>
            <label for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#000000">
            <div id="color-palette">
                <!-- Paleta de colores -->
                <div class="color-swatch" style="background-color: #ffffff;"></div>
                <div class="color-swatch" style="background-color: #6c757d;"></div>
                <div class="color-swatch" style="background-color: #343a40;"></div>
                <div class="color-swatch" style="background-color: #f8f9fa;"></div>
                <div class="color-swatch" style="background-color: #e74c3c;"></div>
                <div class="color-swatch" style="background-color: #c0392b;"></div>
                <div class="color-swatch" style="background-color: #ff6b6b;"></div>
                <div class="color-swatch" style="background-color: #f39c12;"></div>
                <div class="color-swatch" style="background-color: #e67e22;"></div>
                <div class="color-swatch" style="background-color: #f1c40f;"></div>
                <div class="color-swatch" style="background-color: #ffe66d;"></div>
                <div class="color-swatch" style="background-color: #2ecc71;"></div>
                <div class="color-swatch" style="background-color: #27ae60;"></div>
                <div class="color-swatch" style="background-color: #1abc9c;"></div>
                <div class="color-swatch" style="background-color: #3498db;"></div>
                <div class="color-swatch" style="background-color: #2980b9;"></div>
                <div class="color-swatch" style="background-color: #74b9ff;"></div>
                <div class="color-swatch" style="background-color: #9b59b6;"></div>
                <div class="color-swatch" style="background-color: #8e44ad;"></div>
                <div class="color-swatch" style="background-color: #e84393;"></div>
                <div class="color-swatch" style="background-color: #795548;"></div>
                <div class="color-swatch active" style="background-color: #000000;"></div>

        <div id="comparison-container">
            <div id="canvas-container">
                <canvas id="drawingCanvas" width="600" height="400"></canvas>
            </div>
            <div id="ai-image-container" style="display: none;">
                <img id="ai-image-element" src="" alt="Imagen generada por IA">

        <div id="action-buttons">
            <button id="uploadBtn">Subir Boceto</button>
            <button id="submitBtn">Analizar tu obra</button>
            <button id="clearBtn">Limpiar Todo</button>
            <button id="downloadSketchBtn">Descargar Boceto</button>
            <button id="downloadAiBtn" disabled>Descargar Imagen IA</button>

        <div id="ai-generator">
            <p class="section-title">2. Genera la imagen con IA</p>
            <div id="prompt-container">
                <input type="text" id="promptInput" placeholder="La descripción de tu dibujo aparecerá aquí...">
                <select id="styleSelector">
                    <option value="3D cartoon">Cartoon 3D</option>

                    <option value="abstract">Abstracto</option>
                    <option value="impressionist">Impresionista</option>
                    <option value="surrealist">Surrealista</option>
                    <option value="pop art">Arte pop</option>
                    <option value="steampunk">Steampunk</option>
                    <option value="gothic art">Arte gótico</option>
                    <option value="concept art">Arte conceptual</option>

                    <option value="vaporwave art">Arte de vaporwave</option>
                </select>
                <select id="modelSelector">
                    <option value="flux">Flux</option>
                    <option value="zimage">Z Image</option>

        </div>
    </div>
    
    <footer id="page-footer">
        Herramienta diseñada por Juan Guillermo Rivera Berrío con tecnología Gemini 2.5 Pro y las API de Pollinations
    </footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Element Selectors ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadSketchBtn = document.getElementById('downloadSketchBtn');
        const downloadAiBtn = document.getElementById('downloadAiBtn');
        const colorPalette = document.getElementById('color-palette');
        const fillBtn = document.getElementById('fillBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const undoBtn = document.getElementById('undoBtn');
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const canvasOverlay = document.getElementById('canvas-overlay');
        const modelSelector = document.getElementById('modelSelector');
        const styleSelector = document.getElementById('styleSelector');
        
        // --- Upload Elements ---
        const uploadBtn = document.getElementById('uploadBtn');
        const imageUploader = document.getElementById('imageUploader');
        
        // --- Slider Elements ---
        const comparisonContainer = document.getElementById('comparison-container');
        const aiImageContainer = document.getElementById('ai-image-container');
        const aiImageElement = document.getElementById('ai-image-element');
        const sliderHandle = document.getElementById('slider-handle');

        // --- State Variables ---
        let isDrawing = false, lastX = 0, lastY = 0;
        let fillMode = false;
        let eraserMode = false;
        let isDraggingSlider = false;
        let generatedImageUrl = '';
        const canvasHistory = [];
        
        function updateUndoButton() { undoBtn.disabled = canvasHistory.length === 0; }

        function saveCanvasState() {
            const maxHistory = 30;
            if (canvasHistory.length >= maxHistory) canvasHistory.shift();
            canvasHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            updateUndoButton();
        }

        function resetCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvasHistory.length = 0;
            updateUndoButton();
        }
        resetCanvas();

        // --- CORRECCIÓN CRÍTICA: Coordenadas y Escalado ---
        function getMousePos(canvasDom, event) { 
            const rect = canvasDom.getBoundingClientRect(); 
            // Esto corrige el dibujo si el canvas se achica por CSS en pantallas pequeñas
            const scaleX = canvasDom.width / rect.width;
            const scaleY = canvasDom.height / rect.height;

            // Detectar si es toque o mouse
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            }; 
        }

        function setActiveSwatch(selectedSwatch) { colorPalette.querySelectorAll('.color-swatch').forEach(swatch => swatch.classList.remove('active')); if (selectedSwatch) selectedSwatch.classList.add('active'); }

        // --- FUNCIONES DE DIBUJO ---
        function startDrawing(e) {
            // Prevenir scroll en móviles
            if (e.cancelable) e.preventDefault();
            
            if (isDraggingSlider) return; 
            
            const pos = getMousePos(canvas, e); 
            
            if (fillMode) { 
                saveCanvasState();
                floodFill(pos.x, pos.y); 
                return; 
            } 
            
            saveCanvasState();
            isDrawing = true; 
            [lastX, lastY] = [pos.x, pos.y];
        }

        function draw(e) {
            if (!isDrawing || isDraggingSlider) return; 
            if (e.cancelable) e.preventDefault();
            
            const pos = getMousePos(canvas, e); 
            
            ctx.beginPath(); 
            ctx.strokeStyle = eraserMode ? '#ffffff' : colorPicker.value; 
            ctx.lineWidth = brushSize.value; 
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round'; // Suaviza las esquinas
            ctx.moveTo(lastX, lastY); 
            ctx.lineTo(pos.x, pos.y); 
            ctx.stroke(); 
            
            [lastX, lastY] = [pos.x, pos.y];
        }

        function stopDrawing(e) { 
            if (e.cancelable) e.preventDefault();
            isDrawing = false; 
        }
        
        // --- Event Listeners (Mouse & Touch CORREGIDOS) ---
        // Mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        // Touch (Para celulares y tablets)
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        fillBtn.addEventListener('click', () => {
            fillMode = !fillMode;
            if (fillMode && eraserMode) {
                eraserMode = false;
                eraserBtn.classList.remove('active');
            }
            fillBtn.classList.toggle('active', fillMode);
            canvas.style.cursor = fillMode ? 'copy' : 'crosshair';
        });

        eraserBtn.addEventListener('click', () => {
            eraserMode = !eraserMode;
            eraserBtn.classList.toggle('active', eraserMode);
            if (eraserMode && fillMode) {
                fillMode = false;
                fillBtn.classList.remove('active');
            }
            canvas.style.cursor = eraserMode ? 'cell' : 'crosshair';
        });

        undoBtn.addEventListener('click', () => {
            const previousState = canvasHistory.pop();
            if (!previousState) return;
            ctx.putImageData(previousState, 0, 0);
            updateUndoButton();
        });

        colorPalette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-swatch')) {
                const rgbValues = e.target.style.backgroundColor.match(/\d+/g);
                const hexColor = '#' + rgbValues.map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
                colorPicker.value = hexColor;
                setActiveSwatch(e.target);
                eraserMode = false;
                eraserBtn.classList.remove('active');
                canvas.style.cursor = fillMode ? 'copy' : 'crosshair';
            }
        });

        clearBtn.addEventListener('click', () => {
            resetCanvas();
            promptInput.value = '';
            generateBtn.disabled = true;
            aiImageContainer.style.display = 'none';
            sliderHandle.style.display = 'none';
            canvasOverlay.style.display = 'none';
            downloadAiBtn.disabled = true;
            if (generatedImageUrl.startsWith('blob:')) URL.revokeObjectURL(generatedImageUrl);
            generatedImageUrl = '';
        });

        downloadSketchBtn.addEventListener('click', () => {
            canvas.toBlob((blob) => {
                if (!blob) return;
                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = 'mi-boceto.png';
                link.click();
                URL.revokeObjectURL(downloadUrl);
            }, 'image/png');
        });

        downloadAiBtn.addEventListener('click', async () => {
            if (!generatedImageUrl) return;
            downloadAiBtn.disabled = true;
            try {
                const response = await fetch(generatedImageUrl);
                if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = 'imagen-generada-por-ia.png';
                link.click();
                URL.revokeObjectURL(downloadUrl);
            } catch (error) {
                console.error('Error descargando la imagen generada:', error);
                window.open(generatedImageUrl, '_blank', 'noopener');
            } finally {
                downloadAiBtn.disabled = false;
            }
        });

        // --- Upload Logic ---
        uploadBtn.addEventListener('click', () => { imageUploader.click(); });
        imageUploader.addEventListener('change', (event) => {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    resetCanvas(); aiImageContainer.style.display = 'none'; sliderHandle.style.display = 'none'; const canvasAspect = canvas.width / canvas.height; const imageAspect = img.width / img.height; let destWidth, destHeight, x, y;
                    if (imageAspect > canvasAspect) { destWidth = canvas.width; destHeight = destWidth / imageAspect; x = 0; y = (canvas.height - destHeight) / 2; } else { destHeight = canvas.height; destWidth = destHeight * imageAspect; y = 0; x = (canvas.width - destWidth) / 2; }
                    ctx.drawImage(img, x, y, destWidth, destHeight);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file); event.target.value = null;
        });

        // --- Analyze Button Logic ---
        submitBtn.addEventListener('click', async () => {
            submitBtn.disabled = true; generateBtn.disabled = true; canvasOverlay.textContent = "Interpretando tu boceto..."; canvasOverlay.style.display = 'flex';
            try {
                const imageDataUrl = canvas.toDataURL('image/png');
                const imagePrompt = await callBackend('/api/ia/vision', {
                    system: "You are an expert image analyst. Describe the content of the user's sketch with great detail and neutrality. Identify all objects, characters, poses, expressions, spatial relationships, composition, and scene. Respond in English as one detailed paragraph. Do not specify an artistic style such as photorealistic, cartoon, or sketch. Return only the description, which will be used as part of a prompt for an image generator.",
                    prompt: "Describe this drawing for an AI image generator.",
                    image: imageDataUrl,
                    model: 'openai'
                });
                
                if (!imagePrompt || imagePrompt.trim() === "") { throw new Error("No se pudo generar una descripción. ¿El lienzo está en blanco?"); }
                promptInput.value = imagePrompt.trim(); generateBtn.disabled = false; canvasOverlay.textContent = "¡Análisis completado! Listo para generar.";
            } catch (error) { console.error('Error durante el análisis:', error); canvasOverlay.textContent = `Error: ${error.message}`; } finally { submitBtn.disabled = false; }
        });

        // --- Generate Button Logic ---
        generateBtn.addEventListener('click', async () => {
            const basePrompt = promptInput.value.trim();
            if (!basePrompt) { alert("El campo del prompt está vacío. Analiza un dibujo primero."); return; }

            generateBtn.disabled = true; submitBtn.disabled = true;
            let selectedModel = modelSelector.value;
            if (!selectedModel) selectedModel = 'gptimage';
            
            const modelName = modelSelector.options[modelSelector.selectedIndex].text;
            canvasOverlay.textContent = `Generando con ${modelName}...`; canvasOverlay.style.display = 'flex';
            
            const selectedStyle = styleSelector.value;
            const finalPrompt = `Generate a ${selectedStyle} image of ${basePrompt}`;
            const seed = Math.floor(Math.random() * (5000 - 1000 + 1)) + 1000;
            
            try {
                if (generatedImageUrl.startsWith('blob:')) URL.revokeObjectURL(generatedImageUrl);
                generatedImageUrl = '';
                downloadAiBtn.disabled = true;
                const response = await fetch('https://node.proyectodescartes.org/api/ia/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, model: selectedModel, width: canvas.width, height: canvas.height, seed })
                });
                if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);
                const contentType = response.headers.get('content-type') || '';
                const imageUrl = contentType.includes('application/json')
                    ? ((data => data.url || data.output || data)(await response.json()))
                    : URL.createObjectURL(await response.blob());
                if (!imageUrl) throw new Error('El servidor no devolvió una imagen válida.');
                await new Promise((resolve, reject) => {
                    aiImageElement.onload = resolve;
                    aiImageElement.onerror = () => reject(new Error('No se pudo cargar la imagen generada.'));
                    aiImageElement.src = imageUrl;
                });
                generatedImageUrl = imageUrl;
                downloadAiBtn.disabled = false;
                aiImageContainer.style.display = 'block'; sliderHandle.style.display = 'block'; const startX = comparisonContainer.offsetWidth / 2; sliderHandle.style.left = `${startX}px`; aiImageContainer.style.width = `${startX}px`;
                canvasOverlay.style.display = 'none'; generateBtn.disabled = false; submitBtn.disabled = false;
            } catch (error) {
                console.error('Error al generar la imagen:', error);
                alert(`Hubo un error al generar la imagen: ${error.message}`);
                canvasOverlay.style.display = 'none'; generateBtn.disabled = false; submitBtn.disabled = false;
            }
        });
        
        // --- Slider Logic ---
        function startSlide(e) { e.preventDefault(); isDraggingSlider = true; }
        function moveSlide(e) {
            if (!isDraggingSlider) return; e.preventDefault(); 
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = comparisonContainer.getBoundingClientRect(); 
            let x = clientX - rect.left;
            x = Math.max(0, Math.min(x, comparisonContainer.offsetWidth)); sliderHandle.style.left = `${x}px`; aiImageContainer.style.width = `${x}px`;
        }
        function stopSlide() { isDraggingSlider = false; }
        
        sliderHandle.addEventListener('mousedown', startSlide); 
        window.addEventListener('mousemove', moveSlide); 
        window.addEventListener('mouseup', stopSlide);
        
        // Slider touch support
        sliderHandle.addEventListener('touchstart', startSlide, {passive: false});
        window.addEventListener('touchmove', moveSlide, {passive: false});
        window.addEventListener('touchend', stopSlide);

        // --- Helper functions ---
        function floodFill(startX, startY) { startX = Math.floor(startX); startY = Math.floor(startY); const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); const data = imageData.data; const startPos = (startY * canvas.width + startX) * 4; const startR = data[startPos], startG = data[startPos + 1], startB = data[startPos + 2]; const hex = colorPicker.value; const fillR = parseInt(hex.slice(1, 3), 16), fillG = parseInt(hex.slice(3, 5), 16), fillB = parseInt(hex.slice(5, 7), 16); if (startR === fillR && startG === fillG && startB === fillB) return; const pixelStack = [[startX, startY]]; while (pixelStack.length) { const [x, y] = pixelStack.pop(); let currentPos = (y * canvas.width + x) * 4; if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue; if (data[currentPos] === startR && data[currentPos + 1] === startG && data[currentPos + 2] === startB) { data[currentPos] = fillR; data[currentPos + 1] = fillG; data[currentPos + 2] = fillB; data[currentPos + 3] = 255; pixelStack.push([x + 1, y]); pixelStack.push([x - 1, y]); pixelStack.push([x, y + 1]); pixelStack.push([x, y - 1]); } } ctx.putImageData(imageData, 0, 0); }
        
        async function callBackend(path, body) {
            const response = await fetch(`https://node.proyectodescartes.org${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Error del servidor: ${response.status}. ${errorText}`);
            }
            return response.text();
        }
    });
